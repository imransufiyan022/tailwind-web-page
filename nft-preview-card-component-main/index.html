<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
 <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#0b1829] min-h-screen flex justify-center items-center p-5">
  <main class="bg-[#15263d] w-full max-w-sm p-5 rounded-2xl">
    <div class="relative group">
      <img
        src="./images/image-equilibrium.jpg"
        class="w-full rounded-lg"
      >
      <div class="bg-cyan-400 opacity-0 group-hover:opacity-40 flex justify-center items-center rounded-lg">
        <img
          src="./images/icon-view.svg"
          class="w-10"
        >
      </div>
    </div>
    <h1 class="text-white text-xl font-semibold mt-5 hover:text-cyan-300">
      Equilibrium #3429
    </h1>
    <p class="text-[#8aa4c7] mt-3 leading-6">
      Our collection explores balance, creativity and calm.
    </p>
    <div class="flex justify-center mt-5">
      <div class="flex items-center gap-2">
        <img
          src="./images/icon-ethereum.svg"
          class="w-3"
        >
        <p class="text-cyan-300 font-bold">
          0.041 ETH
        </p>
      </div>
      <div class="flex items-center gap-2">
        <img
          src="images/icon-clock.svg"
          alt="Time remaining"
          class="w-4"
        >
        <p class="text-[white]">
          3 days left
        </p>
      </div>
    </div>
    <div class="border-t mt-5 pt-4 flex items-center">
      <img
        src="images/image-avatar.png"
        alt="Creator avatar"
        class="w-8 h-8 rounded-full border border-white"
      >
      <p class="text-[white] ml-3">
        Created by
        <span class="text-[cyan] hover:text-cyan-700">
          Jules Wyvern
        </span>
      </p>
    </div>
  </main>
</body>
</html>
