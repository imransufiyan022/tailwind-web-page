  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Grid Tailwind CSS</title>
</head>
<body class="min-h-screen bg-green-300 font-[Cambria, Cochin, Georgia, Times, 'Times New Roman', serif] text-base flex justify-center items-center p-4 sm:p-6 md:p-8 lg:p-10">
    
<section class="bg-white mx-auto w-full max-w-sm sm:max-w-lg lg:mwax-w-xl p-4 rounded-lg shadow-lg grid grid-cols-1 sm:grid-cols-2 sm:p-6 lg:grid-cols-3 lg:p-8 gap-4">

<article class="bg-purple-400 text-white h-48 p-4 sm:p-6 lg:p-8 w-full rounded-lg shadow-lg text-center hover:bg-purple-600 cursor-pointer">Box One</article>
<article class="bg-blue-400 text-white h-48 p-4 w-full rounded-lg shadow-lg text-center sm:p-6 lg:p-8 hover:bg-blue-600 cursor-pointer">Box Two</article>
<article class="bg-red-400 text-white h-48 p-4 w-full rounded-lg shadow-lg text-center sm:p-6 lg:p-8 hover:bg-red-600 cursor-pointer">Box Three</article>
<article class="bg-orange-400 text-white h-48 p-4 w-full rounded-lg shadow-lg text-center sm:p-6 lg:p-8 hover:bg-orange-500 cursor-pointer">Box Four</article>
<article class="bg-cyan-400 text-white h-48 p-4 w-full rounded-lg shadow-lg text-center sm:p-6 lg:p-8 hover:bg-cyan-600 cursor-pointer">Box Five</article>
<article class="bg-indigo-400 text-white h-48 p-4 w-full rounded-lg shadow-lg text-center sm:p-6 lg:p-8 hover:bg-indigo-600 cursor-pointer">Box Six</article>

<!-- Default breakpoints
-----------------------------
Prefix	   |   Minimum width
-----------------------------
| sm:	     |   640px        | 
| md:	     |   768px        | 
| lg:	     |   1024px       | 
| xl:	     |   1280px       | 
| 2xl:	   |   1536px       | 
----------------------------- -->
</section>
</body>
</html>
</body>
</html>
